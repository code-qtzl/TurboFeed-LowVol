name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Minimal token permissions (principle of least privilege)
permissions:
    contents: read

# Cancel in-progress runs for pull requests when developers push additional changes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Detect which parts of the codebase changed to skip unnecessary jobs
    changes:
        runs-on: ubuntu-latest
        outputs:
            client: ${{ steps.filter.outputs.client }}
            server: ${{ steps.filter.outputs.server }}
            ci: ${{ steps.filter.outputs.ci }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Check changed files
              uses: dorny/paths-filter@v3.0.2
              id: filter
              with:
                  filters: |
                      client:
                        - "client/**"
                        - "package.json"
                        - "package-lock.json"
                      server:
                        - "server/**"
                        - "package.json"
                        - "package-lock.json"
                      ci:
                        - ".github/**"

    # Enforce branch naming convention: feat/, fix/, chore/, hotfix/, sec/, agents/, or docs/
    validate-branch:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Check branch name
              run: |
                  branch="${{ github.head_ref }}"
                  if [[ ! "$branch" =~ ^(feat|fix|chore|hotfix|sec|agents|docs)/ ]]; then
                    echo "❌ Branch '$branch' does not follow the naming convention."
                    echo "   Required prefix: feat/, fix/, chore/, hotfix/, sec/, agents/, or docs/"
                    exit 1
                  fi
                  echo "✅ Branch '$branch' follows the naming convention."

    # Enforce Conventional Commits PR title format (e.g. "feat: add login page")
    validate-pr:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Validate PR title (Conventional Commits)
              uses: amannn/action-semantic-pull-request@v5.5.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Re-run on title edits and new pushes, not just when PR is opened
              if: >
                  github.event.action == 'opened' ||
                  github.event.action == 'synchronize' ||
                  github.event.action == 'reopened' ||
                  github.event.action == 'edited'

    # Block PRs that introduce dependencies with known CVEs
    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Dependency Review
              uses: actions/dependency-review-action@v5.0.0

    client:
        name: Client (React + Vite)
        needs: changes
        if: needs.changes.outputs.client == 'true' || needs.changes.outputs.ci == 'true' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: client

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4.1.0
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4.2.2
              with:
                  path: client/node_modules
                  key: client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
                  restore-keys: client-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test with coverage
              run: npm run test:coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4.4.0
              if: always()
              with:
                  name: coverage-client
                  path: client/coverage/
                  retention-days: 7

            - name: Build
              run: npx vite build

    server:
        name: Server (Express + TypeScript)
        needs: changes
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: server

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4.1.0
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4.2.2
              with:
                  path: server/node_modules
                  key: server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
                  restore-keys: server-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test with coverage
              run: npm run test:coverage

            - name: Upload coverage report
              uses: actions/upload-artifact@v4.4.0
              if: always()
              with:
                  name: coverage-server
                  path: server/coverage/
                  retention-days: 7
