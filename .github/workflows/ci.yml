name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    client:
        name: Client (React + Vite)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: client/node_modules
                  key: client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
                  restore-keys: client-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npx vite build

    server:
        name: Server (Express + TypeScript)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: server/node_modules
                  key: server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
                  restore-keys: server-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Test
              run: npm test
