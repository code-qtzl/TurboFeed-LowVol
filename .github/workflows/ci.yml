name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Minimal token permissions (principle of least privilege)
permissions:
    contents: read

# Cancel in-progress runs for pull requests when developers push additional changes
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    # Detect which parts of the codebase changed to skip unnecessary jobs
    changes:
        runs-on: ubuntu-latest
        outputs:
            client: ${{ steps.filter.outputs.client }}
            server: ${{ steps.filter.outputs.server }}
            ci: ${{ steps.filter.outputs.ci }}
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Check changed files
              uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      client:
                        - "client/**"
                        - "package.json"
                        - "package-lock.json"
                      server:
                        - "server/**"
                        - "package.json"
                        - "package-lock.json"
                      ci:
                        - ".github/**"

    # Enforce Conventional Commits PR title format (e.g. "feat: add login page")
    validate-pr:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
              with:
                  egress-policy: audit

            - name: Validate PR title (Conventional Commits)
              uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Re-run on title edits and new pushes, not just when PR is opened
              if: >
                  github.event.action == 'opened' ||
                  github.event.action == 'synchronize' ||
                  github.event.action == 'reopened' ||
                  github.event.action == 'edited'

    # Block PRs that introduce dependencies with known CVEs
    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Dependency Review
              uses: actions/dependency-review-action@da6e9538c2c3b65e5024c4f6d22b18c0b72c4785 # v4.7.1

    client:
        name: Client (React + Vite)
        needs: changes
        if: needs.changes.outputs.client == 'true' || needs.changes.outputs.ci == 'true' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: client

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
              with:
                  path: client/node_modules
                  key: client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
                  restore-keys: client-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npx vite build

    server:
        name: Server (Express + TypeScript)
        needs: changes
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ci == 'true' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: server

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
              with:
                  path: server/node_modules
                  key: server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
                  restore-keys: server-${{ runner.os }}-

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test
